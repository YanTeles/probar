<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Tabacaria Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
    .admin-container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .admin-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px 20px; position: relative; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.5rem; min-height: 130px; border-top-left-radius: 12px; border-top-right-radius: 12px; }
    .admin-header-content { text-align: center; width: 100%; }
    .admin-header h1 { margin: 0; font-size: clamp(1.8rem, 2.5vw, 2.4rem); }
    .admin-header p { margin: 0.35rem 0 0; font-size: 1rem; opacity: 0.95; }
    .back-btn { position: absolute; left: 1rem; top: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.42rem 0.75rem; border: 1px solid rgba(255,255,255,0.85); color: white; background: rgba(0,0,0,0.2); border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
    .back-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); box-shadow: 0 6px 15px rgba(0,0,0,0.18); }
    .admin-tabs { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); overflow-x: auto; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .tab-btn { border: none; flex: 1; padding: 14px; font-weight: 600; cursor: pointer; transition: background 0.25s; text-align: center; background: rgba(255,255,255,0.2); color: white; font-size: 0.95rem; white-space: nowrap; }
    .tab-btn:hover { background: rgba(255,255,255,0.3); }
    .tab-btn.active { background: white; color: #2d2d64; }
    .tab-panel { display: none; padding: 30px; animation: fadeIn 0.3s; }
    .tab-panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
    input, select, textarea { width: 100%; padding: 14px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 1rem; box-sizing: border-box; transition: all 0.3s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
    .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px 28px; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.3s; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
    .btn-danger { background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%); margin-left: 10px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .product-card-admin { border: 2px solid #e1e5e9; border-radius: 12px; overflow: hidden; background: white; transition: all 0.3s; }
    .product-card-admin:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.12); transform: translateY(-4px); }
    .product-img-admin { width: 100%; height: 200px; object-fit: cover; }
    .product-info-admin { padding: 20px; }
    .product-price-admin { font-size: 1.5em; font-weight: 700; color: #667eea; }
    #addSuccess { background: #d4edda; color: #155724; padding: 20px; border-radius: 8px; margin-top: 20px; display: none; animation: slideIn 0.3s; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .btn { width: 100%; margin-top: 10px; } .admin-tabs { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <div class="admin-header-content">
        <h1>🔧 Painel Admin</h1>
        <p>Gerenciar produtos da Tabacaria Premium</p>
      </div>
      <a href="/" class="back-btn">← Voltar ao Site</a>
    </div>
    
    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="add">➕ Adicionar Produto</button>
      <button class="tab-btn" data-tab="list">📋 Lista de Produtos</button>
    </div>
    
    <!-- ADD TAB -->
    <div id="add" class="tab-panel active">
      <h2>Adicionar Novo Produto</h2>
      <form id="addForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Nome do Produto <span style="color:red">*</span></label>
            <input type="text" name="name" required placeholder="Ex: Charuto Cubano Cohiba">
          </div>
          <div class="form-group">
            <label>Preço (R$) <span style="color:red">*</span></label>
            <input type="number" name="price" step="0.01" min="0.01" required placeholder="29.90">
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>Categoria <span style="color:red">*</span></label>
            <select name="category" required>
              <option value="">Selecione...</option>
              <option value="charuto">Charuto</option>
              <option value="narguilé">Narguilé</option>
              <option value="cigarro">Cigarro</option>
              <option value="cachimbo">Cachimbo</option>
              <option value="acessório">Acessório</option>
            </select>
          </div>
          <div class="form-group">
            <label>Foto <span style="color:red">*</span> (JPG/PNG, máx 5MB)</label>
            <input type="file" name="photo" accept="image/jpeg,image/png" required>
          </div>
        </div>
        <div class="form-group">
          <label>Descrição (opcional)</label>
          <textarea name="desc" rows="3" placeholder="Detalhes do produto, sabor, origem..."></textarea>
        </div>
        <button type="submit" class="btn">➕ Adicionar ao Catálogo</button>
      </form>
      <div id="addSuccess">✅ Produto adicionado com sucesso!</div>
    </div>
    
    <!-- LIST TAB -->
    <div id="list" class="tab-panel">
      <h2>Lista de Produtos (Firebase/Postgres)</h2>
      <div id="productsList" class="products-grid">
        <div style="padding: 40px; text-align: center; color: #666;">
          Clique "Lista" para carregar produtos do servidor<br>
          <small>/api/products</small>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Auth check
    const token = localStorage.getItem('adminToken');
    if (!token) {
      window.location.href = 'admin-login.html';
      throw new Error('Sem token');
    }

    // Tab system
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'list') loadProducts();
      });
    });

    // Add product
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      try {
        const res = await fetch('/api/admin/add', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('addSuccess').style.display = 'block';
          e.target.reset();
          setTimeout(() => document.getElementById('addSuccess').style.display = 'none', 3000);
        } else {
          throw new Error(data.error || 'Erro desconhecido');
        }
      } catch (err) {
        alert('Erro ao adicionar: ' + err.message);
      }
    });

    // Load products
    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        if (!res.ok) throw new Error('Erro carregando produtos');
        const products = await res.json();
        const container = document.getElementById('productsList');
        if (products.length === 0) {
          container.innerHTML = '<div style="padding: 40px; text-align: center; color: #666;">Nenhum produto no banco. Adicione o primeiro!</div>';
        } else {
          container.innerHTML = products.map(p => `
            <div class="product-card-admin">
              <img class="product-img-admin" src="assets/produtos/${p.img_filename || ''}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x200?text=SEM+FOTO'" loading="lazy">
              <div class="product-info-admin">
                <h3>${p.name}</h3>
                <div class="product-price-admin">R$ ${parseFloat(p.price || 0).toFixed(2).replace('.', ',')}</div>
                <p><strong>${p.category}</strong> | ${p.desc || 'Sem descrição'}</p>
                <div style="margin-top: 15px;">
                  <button class="btn" onclick="alert('Editar ${p.id} (futuro)')">Editar</button>
                  <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">Excluir</button>
                </div>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        document.getElementById('productsList').innerHTML = '<div style="padding: 40px; text-align: center; color: #e53e3e;">Erro carregando produtos: ' + err.message + '</div>';
      }
    }

    // Delete product
    window.deleteProduct = function(id) {
      if (confirm('Excluir produto ID ' + id + '?')) {
        fetch(`/api/admin/delete/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        }).then(res => res.json()).then(data => {
          if (data.success) loadProducts();
          else alert('Erro: ' + (data.error || 'Desconhecido'));
        }).catch(err => alert('Erro rede: ' + err));
      }
    };
  </script>
</body>
</html>
