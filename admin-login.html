<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Tabacaria</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Montserrat', sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    }
    .login-container { 
      background: white; 
      padding: 40px; 
      border-radius: 16px; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.15); 
      width: 100%; 
      max-width: 420px; 
      text-align: center; 
    }
    .login-logo { font-size: 2.2rem; margin-bottom: 10px; }
    h1 { color: #2d3748; margin-bottom: 8px; font-weight: 700; font-size: 1.6rem; }
    p { color: #718096; margin-bottom: 30px; font-size: 1rem; }
    .login-form { display: flex; flex-direction: column; gap: 20px; }
    .form-group { position: relative; }
    label { display: block; margin-bottom: 8px; color: #4a5568; font-weight: 500; font-size: 0.95rem; text-align: left; }
    input[type="password"] { 
      width: 100%; padding: 16px 20px; border: 2px solid #e2e8f0; border-radius: 12px; 
      font-size: 1rem; transition: all 0.3s; font-family: inherit; 
    }
    input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 4px rgba(102,126,234,0.1); }
    .login-btn { 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      color: white; border: none; padding: 16px; border-radius: 12px; 
      font-size: 1.1rem; font-weight: 600; cursor: pointer; 
      transition: all 0.3s; 
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102,126,234,0.4); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error { color: #e53e3e; background: #fed7d7; padding: 12px; border-radius: 8px; margin-top: 10px; display: none; font-size: 0.9rem; }
    .success { color: #38a169; background: #c6f6d5; padding: 12px; border-radius: 8px; margin-top: 10px; display: none; }
    @media (max-width: 480px) { .login-container { padding: 30px 24px; } }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">🔧</div>
    <h1>Painel Admin</h1>
    <p>Digite a senha para acessar gerenciamento</p>
    
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="password">Senha Admin</label>
        <input type="password" id="password" name="password" required placeholder="admin123" autocomplete="off">
      </div>
      <button type="submit" class="login-btn">Entrar</button>
    </form>
    
    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.querySelector('.login-btn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    
    // Auto-login if token exists (DEBUG - disable for test)
    // const token = localStorage.getItem('adminToken');
    // if (token) {
    //   window.location.href = 'admin.html';
    // }

    
    form.onsubmit = async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Erro login');
        
        localStorage.setItem('adminToken', data.token);
        successMsg.textContent = 'Login OK! Redirecionando...';
        successMsg.style.display = 'block';
        errorMsg.style.display = 'none';
        
        setTimeout(() => window.location.href = 'admin.html', 1200);
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        successMsg.style.display = 'none';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    };
  </script>
</body>
</html>
