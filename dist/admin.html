<![CDATA[<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Tabacaria Premium (Firebase)</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {margin:0;padding:0;box-sizing:border-box;}body{font-family:'Montserrat',sans-serif;background:linear-gradient(135deg,#f8f9fa 0%,#e9ecef 100%);min-height:100vh;padding:20px;line-height:1.6;}
    .admin-container{max-width:1400px;margin:0 auto;background:white;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.1);overflow:hidden;}
    .header{ background:linear-gradient(135deg,#48e011 0%,#7aff4a 100%);color:white;padding:2rem;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;}
    .header h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3rem);margin:0;}
    .header p{opacity:0.95;font-size:1.1rem;margin-top:0.5rem;}
    .logout{position:absolute;right:1.5rem;top:1.5rem;background:rgba(255,255,255,0.2);color:white;border:none;border-radius:50px;padding:0.8rem 1.5rem;font-weight:600;cursor:pointer;transition:all 0.3s;}
    .logout:hover{background:rgba(255,255,255,0.3);transform:translateY(-2px);}
    .tabs{display:flex;background:#f8f9fa;border-bottom:1px solid #dee2e6;}
    .tab-btn{flex:1;padding:1.2rem;font-weight:600;border:none;background:none;cursor:pointer;transition:all 0.3s;border-bottom:3px solid transparent;color:#6c757d;}
    .tab-btn.active{color:#48e011;border-bottom-color:#48e011;background:white;}
    .tab-btn:hover{color:#48e011;}
    .tab-panel{display:none;padding:2rem;background:white;}
    .tab-panel.active{display:block;}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem;margin-bottom:2rem;}
    .form-group label{display:block;margin-bottom:0.5rem;font-weight:600;color:#333;}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:1rem;border:2px solid #e9ecef;border-radius:10px;font-size:1rem;transition:all 0.3s;}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#48e011;box-shadow:0 0 0 4px rgba(72,224,17,0.1);}
    .btn{display:inline-block;padding:1rem 2rem;background:linear-gradient(135deg,#48e011 0%,#7aff4a 100%);color:white;border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:all 0.3s;text-decoration:none;font-size:1rem;}
    .btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(72,224,17,0.4);}
    .btn-danger{background:linear-gradient(135deg,#dc3545 0%,#c82333 100%);}
    .btn-success{background:linear-gradient(135deg,#28a745 0%,#20c997 100%);}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:1.5rem;}
    .product-card{border:2px solid #e9ecef;border-radius:12px;overflow:hidden;background:white;transition:all 0.3s;cursor:pointer;}
    .product-card:hover{box-shadow:0 15px 40px rgba(0,0,0,0.12);border-color:#48e011;}
    .product-img{width:100%;height:220px;object-fit:cover;}
    .product-body{padding:1.5rem;}
    .product-name{font-family:'Playfair Display',serif;font-size:1.4rem;color:#333;margin-bottom:0.5rem;}
    .product-price{font-size:1.6rem;font-weight:700;color:#48e011;}
    .product-meta{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;font-size:0.9rem;color:#6c757d;}
    .status{padding:1rem;border-radius:8px;margin:1rem 0;}
    .status.success{background:#d4edda;color:#155724;}
    .status.error{background:#f8d7da;color:#721c24;}
    @media (max-width:768px){.form-grid{grid-template-columns:1fr;}.tabs{flex-direction:column;}.products-grid{grid-template-columns:1fr;}}
    .upload-progress{background:#e9ecef;height:8px;border-radius:4px;overflow:hidden;margin-top:0.5rem;}.upload-progress-bar{height:100%;background:linear-gradient(90deg,#48e011,#7aff4a);transition:width 0.3s;}
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="header">
      <h1>🔧 Admin Tabacaria Premium</h1>
      <p>Gerenciar Produtos Firebase (Upload + CRUD)</p>
      <button class="logout" onclick="logout()">Sair 🔓</button>
    </div>
    
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('add')">➕ Novo Produto</button>
      <button class="tab-btn" onclick="showTab('list')">📋 Produtos</button>
    </div>
    
    <!-- ADD TAB -->
    <div id="add" class="tab-panel active">
      <h2>Adicionar Produto</h2>
      <form id="addForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Nome *</label>
            <input type="text" name="name" required>
          </div>
          <div class="form-group">
            <label>Preço (R$) *</label>
            <input type="number" name="price" step="0.01" min="0" required>
          </div>
          <div class="form-group">
            <label>Categoria *</label>
            <select name="category" required>
              <option value="">Selecionar</option>
              <option value="charuto">Charuto</option>
              <option value="narguilé">Narguilé</option>
              <option value="cigarro">Cigarro</option>
              <option value="cachimbo">Cachimbo</option>
              <option value="acessório">Acessório</option>
            </select>
          </div>
          <div class="form-group">
            <label>Foto * (JPG/PNG)</label>
            <input type="file" name="photo" accept="image/jpeg,image/png" required>
            <div class="upload-progress" id="uploadProgress" style="display:none;">
              <div class="upload-progress-bar" id="progressBar"></div>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <textarea name="desc" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-success">➕ Adicionar ao Firebase</button>
      </form>
      <div id="status" class="status" style="display:none;"></div>
    </div>
    
    <!-- LIST TAB -->
    <div id="list" class="tab-panel">
      <h2>Lista de Produtos</h2>
      <div id="productsGrid" class="products-grid">Carregando...</div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBCcC-VLZtGu1HcKmM6uvU41Dza--k0ki0",
      authDomain: "probar-da4e3.firebaseapp.com",
      projectId: "probar-da4e3",
      storageBucket: "probar-da4e3.firebasestorage.app",
      messagingSenderId: "432043671272",
      appId: "1:432043671272:web:cfbee03006fd801668535d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentTab = 'add';
    const ADMIN_PASSWORD = 'admin123'; // Mude para produção

    // Login check
    let loggedIn = localStorage.getItem('adminLogged') === 'true';
    if (!loggedIn) {
      const pass = prompt('Senha Admin:');
      if (pass !== ADMIN_PASSWORD) {
        alert('Senha incorreta');
        window.location.href = './';
        throw new Error('Auth failed');
      }
      localStorage.setItem('adminLogged', 'true');
      loggedIn = true;
    }

    function logout() {
      localStorage.removeItem('adminLogged');
      window.location.href = './';
    }

    function showStatus(msg, type = 'success') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = `status ${type}`;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
      currentTab = tab;
      if (tab === 'list') loadProducts();
    }

    // ADD PRODUCT
    document.getElementById('addForm').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const name = formData.get('name');
      const price = parseFloat(formData.get('price'));
      const category = formData.get('category');
      const photo = formData.get('photo');
      const desc = formData.get('desc') || '';

      if (!photo) return showStatus('Selecione foto', 'error');

      const progressEl = document.getElementById('uploadProgress');
      const barEl = document.getElementById('progressBar');
      progressEl.style.display = 'block';

      try {
        // Upload foto Storage
        const storageRef = ref(storage, `produtos/${Date.now()}_${photo.name}`);
        const uploadTask = uploadBytesResumable(storageRef, photo);

        uploadTask.on('state_changed',
          (snapshot) => {
            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
            barEl.style.width = progress + '%';
          },
          (error) => showStatus('Erro upload: ' + error.message, 'error'),
          async () => {
            const downloadURL = await getDownloadURL(storageRef);
            
            // Salvar produto Firestore
            await addDoc(collection(db, 'products'), {
              name, price, category, desc,
              img_filename: storageRef.name,
              img_url: downloadURL,
              created_at: new Date()
            });
            
            showStatus('✅ Produto adicionado com sucesso!');
            e.target.reset();
            progressEl.style.display = 'none';
            barEl.style.width = '0%';
            if (currentTab === 'list') loadProducts();
          }
        );
      } catch (error) {
        showStatus('Erro: ' + error.message, 'error');
        progressEl.style.display = 'none';
      }
    };

    // LOAD PRODUCTS
    async function loadProducts() {
      try {
        const q = query(collection(db, 'products'), orderBy('created_at', 'desc'));
        const snapshot = await getDocs(q);
        const products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        const grid = document.getElementById('productsGrid');
        if (products.length === 0) {
          grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#6c757d;padding:3rem;">Nenhum produto. Adicione o primeiro! 🚀</p>';
          return;
        }
        
        grid.innerHTML = products.map(p => `
          <div class="product-card">
            <img class="product-img" src="${p.img_url || p.img_filename}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/350x220/48e011/fff?text=SEM+FOTO'">
            <div class="product-body">
              <div class="product-name">${p.name}</div>
              <div class="product-price">R$ ${p.price?.toFixed(2).replace('.', ',') || '0,00'}</div>
              <div class="product-meta">
                <span>${p.category}</span>
                <span>${p.created_at?.toDate ? p.created_at.toDate().toLocaleDateString('pt-BR') : 'Data inválida'}</span>
              </div>
              <div style="margin-top:1rem">
                <button class="btn" onclick="editProduct('${p.id}')">Editar</button>
                <button class="btn btn-danger" onclick="deleteProduct('${p.id}')" style="margin-left:0.5rem">🗑️ Excluir</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('productsGrid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#dc3545;">Erro carregando: ' + error.message + '</p>';
      }
    }

    window.editProduct = async (id) => {
      const name = prompt('Novo nome:');
      if (!name) return;
      // Implement full edit dialog if needed
      showStatus('Editado: ' + name, 'success');
    };

    window.deleteProduct = async (id) => {
      if (!confirm('Excluir produto?')) return;
      try {
        await deleteDoc(doc(db, 'products', id));
        showStatus('🗑️ Excluído!');
        loadProducts();
      } catch (error) {
        showStatus('Erro excluir: ' + error.message, 'error');
      }
    };

    // Init
    loadProducts();
  </script>
</body>
</html>]]>
